[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmg-tk-dataviewer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mmg-toolbox>=0.6.5",
]
authors = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
maintainers = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
description = "a simple NeXus dataviewer for the Diamond Magnetic Materials Group"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ['nexus']
classifiers = [
    'Programming Language :: Python :: 3.10',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: Apache Software License',
    'Development Status :: 3 - Alpha',
]
