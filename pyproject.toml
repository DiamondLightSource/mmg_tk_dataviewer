[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmg-tk-dataviewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "pillow",
    "matplotlib",
    "mmg-toolbox",
]
authors = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
maintainers = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
description = "a simple NeXus dataviewer for the Diamond Magnetic Materials Group"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ['nexus']
classifiers = [
    'Programming Language :: Python :: 3.10',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: Apache Software License',
    'Development Status :: 3 - Alpha',
]

[project.scripts]
dataviewer = "mmg_tk_dataviewer:cli_run"

[project.optional-dependencies]

dev = [
    "pytest",
    "scipy-stubs>=1.15.3.0",
    "pillow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mmg-toolbox = { path = "../mmg_toolbox", editable = true }

