[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmg-tk-dataviewer"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "pillow",
    "matplotlib",
    "mmg-toolbox>=0.8.0",  # 9-value ROIs with peak search
    "PySide6<6.10",  # 6.10+ wheels need glibc 2.34; RHEL 8 has 2.28
]
authors = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
maintainers = [{ name = "Dan Porter", email = "dan.porter@diamond.ac.uk" }]
description = "a simple NeXus dataviewer for the Diamond Magnetic Materials Group"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ['nexus', 'hdf5', 'diamond', 'tkinter', 'dataviewer']
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: Apache Software License',
    'Development Status :: 3 - Alpha',
]

[project.urls]
Homepage = "https://github.com/DiamondLightSource/mmg_tk_dataviewer"
Repository = "https://github.com/DiamondLightSource/mmg_tk_dataviewer"
Documentation = "https://diamondlightsource.github.io/mmg_toolbox"

[project.scripts]
dataviewer = "mmg_tk_dataviewer:cli_run"
dataviewer-qt = "mmg_qt_dataviewer:cli_run"

[project.optional-dependencies]

dev = [
    "pytest",
    "scipy-stubs>=1.15.3.0",
    "pillow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mmg-toolbox = { path = "../mmg_toolbox", editable = true }

